    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --green: #3fb950;
        --red: #f85149;
        --amber: #d29922;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        min-height: 100vh;
      }
      #root {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
        letter-spacing: -0.02em;
      }
      .muted {
        color: var(--muted);
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-top: 16px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 6px 0;
      }
      .row .k {
        color: var(--muted);
      }
      .row .v {
        text-align: right;
        word-break: break-all;
      }
      button {
        font: inherit;
        background: var(--accent);
        color: #0d1117;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .ok {
        color: var(--green);
      }
      .err {
        color: var(--red);
      }
      .pending {
        color: var(--amber);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="padding: 32px 24px; max-width: 720px; margin: 0 auto">
        <h1>swap</h1>
        <p style="color: var(--muted)">loading wallet UI…</p>
        <noscript style="color: var(--red)">
          enable JavaScript to use the swap browser flow
        </noscript>
      </div>
    </div>
    <script>
      // Surface any pre-React error visibly. Without this, a thrown
      // exception during module init leaves the page blank with no clue.
      window.addEventListener("error", function (e) {
        // Only pre-boot, same-origin errors: once React owns #root, wiping it
        // here cascades into "removeChild" render errors; extension-injected
        // scripts (chrome-extension://) throw errors that aren't ours.
        if (window.__swapBooted) return;
        if (e.filename && e.filename.indexOf(location.origin) !== 0) return;
        var root = document.getElementById("root");
        if (root) {
          root.innerHTML =
            '<div style="padding:32px 24px;max-width:720px;margin:0 auto">' +
            '<h1>swap — script error</h1>' +
            '<pre style="white-space:pre-wrap;color:var(--red)">' +
            (e.message || String(e.error)) +
            "</pre><p style=\"color:var(--muted)\">Check the JS console for the full stack.</p></div>";
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
