<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../web/src/ds/fonts/jetbrainsmono-500.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("../web/src/ds/fonts/manrope-500.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("../web/src/ds/fonts/manrope-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Manrope";
        src: url("../web/src/ds/fonts/manrope-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0810;
      }
      .frame {
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        padding: 36px;
        background:
          radial-gradient(ellipse 52% 68% at 92% 8%, rgba(255, 150, 85, 0.22) 0%, transparent 58%),
          radial-gradient(ellipse 48% 72% at 78% 0%, rgba(255, 0, 140, 0.28) 0%, transparent 64%),
          #0a0810;
      }
      .card {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        padding: 56px 68px 48px;
        display: flex;
        flex-direction: column;
        background: rgba(17, 14, 24, 0.42);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .mark {
        flex: none;
        display: block;
        width: 92px;
        height: 109px;
      }
      .word {
        font-family: "Manrope", system-ui, sans-serif;
        font-weight: 700;
        font-size: 112px;
        line-height: 0.92;
        letter-spacing: -0.045em;
        color: #ffffff;
      }
      .lead {
        margin: 28px 0 0;
        font-family: "Manrope", system-ui, sans-serif;
        font-weight: 600;
        font-size: 34px;
        letter-spacing: -0.03em;
        color: #ece9f3;
      }
      .venues {
        margin: 16px 0 0;
        max-width: 980px;
        font-family: "Manrope", system-ui, sans-serif;
        font-weight: 500;
        font-size: 22px;
        line-height: 1.4;
        color: #a59fb8;
      }
      .nowrap {
        white-space: nowrap;
      }
      .foot {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-weight: 500;
        font-size: 20px;
      }
      .host {
        color: #ff5ca8;
      }
      .meta {
        color: #6f6982;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="brand">
          <svg

            viewBox="0 0 145 172"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >

              fill="url(#og9_left)"
            />
            <path
              d="M71.7235 50.8234L71.9228 50.6929L90.7966 62.9009L101.799 95.5289L110.98 105.768L121.842 106.467L129.86 116.824C128.512 118.568 127.08 120.25 125.582 121.864L81.9021 171.876H33.5701L77.4375 121.542L76.5252 115.211L69.1196 119.155L49.4908 112.1L56.0217 101.749L68.2799 107.748L59.2237 89.9922L68.2799 72.8386L64.1474 62.9009L71.7235 50.8234Z"
              fill="url(#og9_right)"
            />
          </svg>
          <span class="word">9Swap</span>
        </div>
        <div class="lead">CLI and dApp DEX meta-aggregator</div>
        <div class="venues">
          1inch · 0x · KyberSwap · Velora · CoW · Curve · Uniswap · OpenOcean · and more.
          <span class="nowrap">Non-custodial.</span>
        </div>
        <div class="foot">
          <span class="host">swap.9summits.io</span>
          <span class="meta">14 EVM chains</span>
        </div>
      </div>
    </div>
  </body>
</html>
